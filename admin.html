<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Health Tech Pro</title>
<style>
:root{--bg:#050b20;--panel:#101a33;--blue:#078bff;--cyan:#16d9ff;--gold:#ffca28;--muted:#aebedc}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(105px);opacity:.16;pointer-events:none;z-index:-1}
body:before{background:#078bff;top:-130px;left:-150px}
body:after{background:#6040e8;right:-150px;bottom:-120px}
button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#080f29;border-bottom:1px solid var(--blue);padding:14px 16px;box-shadow:0 5px 20px #0008}
.top{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:18px;font-weight:bold}.brand span{color:var(--gold)}
.header-actions{display:flex;align-items:center;gap:10px}
.admin-email{font-size:12px;color:var(--cyan);overflow-wrap:anywhere}
.btn{border:1px solid #2863b2;border-radius:20px;padding:9px 14px;background:#10294b;color:#dceaff;font-weight:bold}
.btn.primary{background:linear-gradient(90deg,#ffd34d,#ff9f00);color:#111;border:0}
.btn.danger{border-color:#a34d65;color:#ffc1c9;background:#351b30}
main{max-width:1200px;margin:auto;padding:25px 15px 45px}
.login-wrap{max-width:420px;margin:7vh auto}
.panel{background:linear-gradient(145deg,#172747,#0a1229);border:1px solid #176dcb;border-radius:17px;padding:20px;box-shadow:0 0 18px #087fff44;margin-bottom:18px}
h1{font-size:clamp(25px,5vw,34px);margin-bottom:7px}h1 span{color:var(--gold)}
.subtitle,.muted{color:var(--muted);font-size:13px;line-height:1.6}
h2{font-size:19px;color:var(--cyan);margin-bottom:14px}
.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px;color:#dceaff}
.field input,.field select{width:100%;padding:13px;border:1px solid #2863b2;border-radius:9px;background:#0b1833;color:white;outline:none}
.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 10px #078bff55}
.full-btn{width:100%;padding:13px;border:0;border-radius:24px;background:linear-gradient(90deg,#ffd34d,#ff9f00);font-weight:bold;color:#111}
.message{display:none;margin-top:13px;padding:11px;border-radius:9px;background:#0b2340;border:1px solid #2863b2;color:#dceaff;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.message.error{border-color:#e05b70;color:#ffb5c0}.message.success{border-color:#20bd86;color:#9dffd9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat{background:#0c1d3a;border:1px solid #28456d;border-radius:13px;padding:15px}
.stat small{display:block;color:#9db0d0;font-size:12px;margin-bottom:7px}.stat strong{font-size:24px;color:var(--gold)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}
.toolbar input,.toolbar select{flex:1;min-width:150px;padding:11px;border:1px solid #2863b2;border-radius:9px;background:#0b1833;color:white}
.order-list{display:grid;gap:14px}
.order-card{background:#0c1d3a;border:1px solid #28456d;border-radius:14px;padding:16px}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;border-bottom:1px solid #28456d;padding-bottom:12px;margin-bottom:12px}
.order-id{font-size:13px;color:var(--cyan);font-weight:bold;overflow-wrap:anywhere}
.order-date{font-size:11px;color:#91a7ca;margin-top:5px}
.status-pill{font-size:11px;padding:6px 10px;border-radius:20px;background:#173d61;color:#bdeaff;border:1px solid #2863b2}
.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.detail{min-width:0;background:#101d3b;border-radius:9px;padding:11px}
.detail label{display:block;color:#91a7ca;font-size:11px;margin-bottom:5px}
.detail div{font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.products{margin-top:13px;border:1px solid #28456d;border-radius:10px;overflow:hidden}
.product-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-bottom:1px solid #28456d;font-size:12px;line-height:1.5}
.product-row:last-child{border-bottom:0}.product-row strong{color:#fff}
.total-row{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid #28456d;font-weight:bold}
.total-row strong{color:var(--gold);font-size:20px}
.order-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px}
.order-actions select{flex:1;min-width:155px;padding:10px;border:1px solid #2863b2;border-radius:9px;background:#0b1833;color:white}
.empty{text-align:center;color:var(--muted);padding:28px 10px}.loading{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:600px){main{padding:18px 11px 35px}.panel{padding:15px}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:20px}.details-grid{grid-template-columns:1fr}.admin-email{max-width:125px}.brand{font-size:15px}}
</style>
</head>
<body>
<header><div class="top">
<div class="brand">HEALTH TECH <span>PRO</span> <small style="color:#91a7ca;font-size:11px">ADMIN</small></div>
<div class="header-actions" id="headerActions" style="display:none">
<span class="admin-email" id="adminEmail"></span>
<button class="btn danger" type="button" onclick="adminLogout()">Logout</button>
</div></div></header>
<main>
<section class="login-wrap panel" id="loginPanel">
<h1>Admin <span>Login</span></h1>
<p class="subtitle">Sign in with your authorized administrator account.</p>
<form id="adminLoginForm">
<div class="field"><label for="adminEmailInput">Admin Email</label><input id="adminEmailInput" type="email" autocomplete="username" required placeholder="Enter admin email"></div>
<div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" required placeholder="Enter password"></div>
<button class="full-btn" id="loginButton" type="submit">LOGIN TO DASHBOARD →</button>
</form><div class="message" id="loginMessage"></div>
</section>
<section id="dashboard" style="display:none">
<h1>Admin <span>Dashboard</span></h1><p class="subtitle">Manage customer orders and update their status.</p>
<div class="stats">
<div class="stat"><small>Total Orders</small><strong id="totalOrders">0</strong></div>
<div class="stat"><small>New Orders</small><strong id="newOrders">0</strong></div>
<div class="stat"><small>Completed</small><strong id="completedOrders">0</strong></div>
</div>
<section class="panel"><h2>Customer Orders</h2>
<div class="toolbar">
<input id="searchOrders" type="search" placeholder="Search name, email, phone or order ID..." oninput="renderOrders()">
<select id="statusFilter" onchange="renderOrders()">
<option value="">All Statuses</option><option>New Order</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option>
</select>
<button class="btn" type="button" onclick="loadOrders()">↻ Refresh</button>
</div><div id="ordersArea" class="loading">Loading orders...</div>
</section></section></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyD0SMf_qXQe4_KHv0JJqbPxfsETGfZJkjw",
  authDomain:"health-tech-pro-435aa.firebaseapp.com",
  projectId:"health-tech-pro-435aa",
  storageBucket:"health-tech-pro-435aa.firebasestorage.app",
  messagingSenderId:"545516143300",
  appId:"1:545516143300:web:34543d5e0c791b241ebf91"
};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
let currentAdmin=null;
let orders=[];
const el=id=>document.getElementById(id);
const money=value=>"৳ "+Number(value||0).toLocaleString("en-BD");

function showLoginMessage(message,isError=true){
  const box=el("loginMessage");
  box.textContent=message;
  box.className="message"+(isError?" error":" success");
  box.style.display="block";
}
function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}
function formatDate(timestamp){
  if(!timestamp)return "Date not available";
  const date=timestamp.toDate?timestamp.toDate():new Date(timestamp);
  return Number.isNaN(date.getTime())?"Date not available":date.toLocaleString();
}

el("adminLoginForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const button=el("loginButton");
  button.disabled=true;button.textContent="VERIFYING...";
  try{
    await auth.signInWithEmailAndPassword(el("adminEmailInput").value.trim(),el("adminPassword").value);
  }catch(error){
    showLoginMessage(error.code==="auth/invalid-credential"?"Email or password is incorrect.":(error.message||"Login failed."));
    button.disabled=false;button.textContent="LOGIN TO DASHBOARD →";
  }
});

auth.onAuthStateChanged(async user=>{
  if(!user){
    currentAdmin=null;
    el("dashboard").style.display="none";
    el("headerActions").style.display="none";
    el("loginPanel").style.display="block";
    el("loginButton").disabled=false;
    el("loginButton").textContent="LOGIN TO DASHBOARD →";
    return;
  }
  try{
    // Verify admin using the signed-in user's UID as the Firestore document ID.
    const adminDoc=await db.collection("admins").doc(user.uid).get();
    console.log("LOGIN UID:", user.uid);
    console.log("DOCUMENT EXISTS:", adminDoc.exists);
    console.log("ADMIN DATA:", adminDoc.data());
    console.log("ROLE:", adminDoc.data()?.role);
    const adminData=adminDoc.exists?adminDoc.data():null;
    const isAdmin=!!adminData && adminData.role==="admin";

    if(!isAdmin){
      await auth.signOut();
      el("loginPanel").style.display="block";
      showLoginMessage("Access denied. The signed-in account has no admins/"+user.uid+" document with role set to admin.");
      return;
    }
    currentAdmin=user;
    el("loginPanel").style.display="none";
    el("dashboard").style.display="block";
    el("headerActions").style.display="flex";
    el("adminEmail").textContent=user.email||"Administrator";
    await loadOrders();
  }catch(error){
    console.error("Admin verification failed:",error);
    el("dashboard").style.display="none";
    el("loginPanel").style.display="block";
    showLoginMessage("Admin verification failed: "+(error.message||error.code||"Unknown error")+". Check Firestore Rules and connection.");
  }
});

async function adminLogout(){
  try{await auth.signOut();location.reload();}
  catch(error){alert("Logout failed: "+error.message);}
}

async function loadOrders(){
  if(!currentAdmin)return;
  el("ordersArea").textContent="Loading orders...";
  try{
    const snapshot=await db.collection("orders").orderBy("createdAt","desc").get();
    orders=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
    updateStats();renderOrders();
  }catch(error){
    console.error("Load orders failed:",error);
    el("ordersArea").innerHTML='<div class="empty">Could not load orders. Check Firestore Rules and the orders collection.<br><small>'+escapeHTML(error.message)+'</small></div>';
  }
}
function updateStats(){
  el("totalOrders").textContent=orders.length;
  el("newOrders").textContent=orders.filter(o=>(o.orderStatus||"New Order")==="New Order").length;
  el("completedOrders").textContent=orders.filter(o=>o.orderStatus==="Delivered").length;
}
function renderOrders(){
  const area=el("ordersArea");
  const query=el("searchOrders").value.trim().toLowerCase();
  const status=el("statusFilter").value;
  const filtered=orders.filter(order=>{
    const c=order.customer||{};
    const searchable=[order.id,order.customerEmail,c.name,c.mobileNumber,c.district,c.areaOrThana].join(" ").toLowerCase();
    return searchable.includes(query)&&(!status||(order.orderStatus||"New Order")===status);
  });
  if(!filtered.length){area.innerHTML='<div class="empty">No orders found.</div>';return;}
  area.innerHTML="";
  filtered.forEach(order=>{
    const c=order.customer||{},summary=order.orderSummary||{},payment=order.payment||{};
    const products=Array.isArray(summary.products)?summary.products:[];
    const card=document.createElement("article");card.className="order-card";
    const productHTML=products.length?products.map(product=>`
      <div class="product-row"><div><strong>${escapeHTML(product.productName||product.name||product.productId||"Product")}</strong><br>
      Quantity: ${escapeHTML(product.quantity??1)} × ${money(product.unitPrice)}</div>
      <strong>${money(product.lineTotal??((Number(product.quantity)||1)*(Number(product.unitPrice)||0)))}</strong></div>`).join(""):'<div class="product-row">Product details unavailable</div>';
    const statusOptions=["New Order","Confirmed","Processing","Shipped","Delivered","Cancelled"];
    const currentStatus=order.orderStatus||"New Order";
    card.innerHTML=`
      <div class="order-head"><div><div class="order-id">ORDER #${escapeHTML(order.id)}</div><div class="order-date">${escapeHTML(formatDate(order.createdAt))}</div></div><span class="status-pill">${escapeHTML(currentStatus)}</span></div>
      <div class="details-grid">
        <div class="detail"><label>CUSTOMER</label><div>${escapeHTML(c.name||"Not provided")}<br>${escapeHTML(order.customerEmail||"Email not available")}</div></div>
        <div class="detail"><label>CONTACT</label><div>${escapeHTML(c.mobileNumber||"")}<br>Alternative: ${escapeHTML(c.alternativeMobileNumber||"Not provided")}</div></div>
        <div class="detail"><label>DELIVERY ADDRESS</label><div>${escapeHTML(c.fullAddress||"Not provided")}<br>${escapeHTML([c.areaOrThana,c.district].filter(Boolean).join(", "))}</div></div>
        <div class="detail"><label>PAYMENT</label><div>${escapeHTML(payment.method||"Not specified")}<br>Status: ${escapeHTML(payment.status||"Not specified")}<br>Sender: ${escapeHTML(payment.senderMobileNumber||"N/A")}<br>TrxID: ${escapeHTML(payment.transactionId||"N/A")}</div></div>
      </div>
      <div class="products">${productHTML}</div>
      <div class="total-row"><span>Subtotal: ${money(summary.subtotal)}<br><small style="color:#91a7ca;font-weight:normal">Delivery: ${money(summary.deliveryCharge)}</small></span><strong>${money(summary.total)}</strong></div>
      <div class="order-actions">
        <select aria-label="Update order status" id="status-${escapeHTML(order.id)}">${statusOptions.map(option=>`<option value="${option}" ${option===currentStatus?"selected":""}>${option}</option>`).join("")}</select>
        <button class="btn primary" type="button" data-update="${escapeHTML(order.id)}">Update Status</button>
        <button class="btn danger" type="button" data-delete="${escapeHTML(order.id)}">Delete Order</button>
      </div>`;
    card.querySelector("[data-update]").addEventListener("click",()=>updateOrderStatus(order.id));
    card.querySelector("[data-delete]").addEventListener("click",()=>deleteOrder(order.id));
    area.appendChild(card);
  });
}
async function updateOrderStatus(orderId){
  if(!currentAdmin)return;
  const select=el("status-"+orderId),newStatus=select.value;
  try{
    await db.collection("orders").doc(orderId).update({orderStatus:newStatus});
    const found=orders.find(o=>o.id===orderId);if(found)found.orderStatus=newStatus;
    updateStats();renderOrders();alert("Order status updated.");
  }catch(error){console.error(error);alert("Could not update order: "+error.message);}
}
async function deleteOrder(orderId){
  if(!currentAdmin)return;
  if(!confirm("Are you sure you want to delete this order? This cannot be undone."))return;
  try{
    await db.collection("orders").doc(orderId).delete();
    orders=orders.filter(o=>o.id!==orderId);updateStats();renderOrders();alert("Order deleted.");
  }catch(error){console.error(error);alert("Could not delete order: "+error.message);}
}
</script>
</body>
</html>
