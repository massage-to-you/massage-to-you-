
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Details | HEALTH TECH PRO</title>

<style>
:root{
 --bg:#050b20;
 --panel:#101a33;
 --blue:#078bff;
 --cyan:#16d9ff;
 --gold:#ffca28;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:var(--bg);color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#080f29;padding:14px;
 border-bottom:1px solid var(--blue);
 position:sticky;top:0;z-index:10;
 display:flex;justify-content:space-between;
 align-items:center;
}
.brand{font-size:18px;font-weight:bold}
.brand span{color:var(--gold)}
header a{color:white;text-decoration:none}
.cart-link{font-size:23px;color:white;text-decoration:none}
#cartCount{color:var(--gold);font-size:14px}
.container{max-width:950px;margin:25px auto;padding:15px}
.breadcrumb{color:#9db1d3;font-size:13px;margin-bottom:18px}
.product{
 background:linear-gradient(145deg,#172747,#0a1229);
 border:1px solid #176dcb;
 border-radius:18px;padding:18px;
 box-shadow:0 0 20px #087fff33;
}
.image-area{
 background:radial-gradient(circle,#164477,#101a33 70%);
 border-radius:14px;padding:12px;
}
.main-image{
 width:100%;height:310px;
 object-fit:contain;
}
.thumbnails{display:flex;gap:10px;margin-top:12px}
.thumbnails img{
 width:65px;height:65px;object-fit:contain;
 background:#15274a;border-radius:9px;
 border:1px solid #2863b2;padding:4px;
 cursor:pointer;
}
.category{color:var(--cyan);font-size:13px;margin-top:20px}
h1{font-size:26px;margin:10px 0}
.rating{color:var(--gold);margin:10px 0}
.price{margin:17px 0}
.current{font-size:30px;color:var(--gold);font-weight:bold}
.old{color:#8595b3;text-decoration:line-through;margin-left:8px}
.discount{
 background:#183e64;color:var(--cyan);
 padding:5px 9px;border-radius:6px;
 font-size:12px;margin-left:7px;
}
.info{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px;margin:20px 0;
}
.info div{
 background:#0d1932;border:1px solid #23436e;
 padding:13px;border-radius:10px;
}
.info small{display:block;color:#9db1d3;margin-bottom:6px}
.info strong{font-size:14px}
.stock{color:#16d9a0}
.quantity{
 display:flex;align-items:center;gap:15px;
 margin:20px 0;
}
.quantity button{
 width:38px;height:38px;border:1px solid #2863b2;
 background:#15274a;color:white;
 border-radius:9px;font-size:20px;cursor:pointer;
}
.quantity span{font-size:18px;font-weight:bold}
.actions{display:grid;gap:11px}
.actions button{
 padding:15px;border:0;border-radius:10px;
 font-weight:bold;font-size:15px;cursor:pointer;
}
.add{background:linear-gradient(90deg,#087fff,#5941db);color:white}
.buy{background:linear-gradient(90deg,#ffd34d,#ff9f00);color:#111}
.description{
 margin-top:20px;
 background:#101a33;
 border:1px solid #176dcb;
 border-radius:15px;padding:20px;
}
.description h2{color:var(--gold);font-size:21px;margin-bottom:15px}
.description p{
 color:#c2d0e8;line-height:1.8;font-size:14px;
}
.description ul{padding-left:20px;margin-top:12px}
.description li{
 color:#dceaff;margin:12px 0;
 line-height:1.6;font-size:14px;
}
footer{
 text-align:center;padding:25px;
 color:#9db1d3;margin-top:20px;
}
.toast{
 position:fixed;bottom:20px;left:50%;
 transform:translateX(-50%);
 background:#102d59;border:1px solid var(--cyan);
 padding:13px 20px;border-radius:25px;
 display:none;z-index:30;
}
.whatsapp{
 position:fixed;right:17px;bottom:20px;
 width:55px;height:55px;border-radius:50%;
 background:#20c767;color:white;
 display:grid;place-items:center;
 font-size:29px;text-decoration:none;
 box-shadow:0 0 18px #20c76777;z-index:20;
}
@media(min-width:700px){
 .product{
  display:grid;grid-template-columns:1fr 1fr;
  gap:25px;padding:25px;
 }
 .image-area{align-self:start}
 .main-image{height:400px}
 .details{padding:8px}
 .actions{grid-template-columns:1fr 1fr}
}
@media(max-width:450px){
 .container{padding:12px}
 .main-image{height:260px}
 h1{font-size:22px}
}
</style>
</head>

<body>

<header>
 <div class="brand">HEALTH TECH <span>PRO</span></div>
 <a href="index.html">← Home</a>
 <a class="cart-link" href="checkout.html">
  🛒 <span id="cartCount">0</span>
 </a>
</header>

<div class="container">

 <div class="breadcrumb">
  Home / Product Details
 </div>

 <div class="product">

  <div>
   <div class="image-area">
    <img id="mainImage" class="main-image" src="" alt="Product">
   </div>
   <div class="thumbnails" id="thumbnails"></div>
  </div>

  <div class="details">

   <div class="category" id="category"></div>

   <h1 id="name"></h1>

   <div class="rating" id="rating"></div>

   <div class="price">
    <span class="current" id="price"></span>
    <span class="old" id="oldPrice"></span>
    <span class="discount" id="discount"></span>
   </div>

   <div class="info">
    <div>
     <small>Availability</small>
     <strong class="stock" id="stock"></strong>
    </div>
    <div>
     <small>Warranty</small>
     <strong id="warranty"></strong>
    </div>
    <div>
     <small>Product ID</small>
     <strong id="productId"></strong>
    </div>
    <div>
     <small>Sold</small>
     <strong id="sold"></strong>
    </div>
   </div>

   <div class="quantity">
    <b>Quantity:</b>
    <button onclick="changeQty(-1)">−</button>
    <span id="qty">1</span>
    <button onclick="changeQty(1)">+</button>
   </div>

   <div class="actions">
    <button class="add" onclick="addToCart()">
     🛒 ADD TO CART
    </button>
    <button class="buy" onclick="buyNow()">
     BUY NOW →
    </button>
   </div>

  </div>

 </div>

 <section class="description">
  <h2>PRODUCT DESCRIPTION</h2>
  <p id="description"></p>
  <ul id="features"></ul>
 </section>

</div>

<footer>
 HEALTH TECH PRO<br>
 ADVANCED WELLNESS • DHAKA, BANGLADESH
</footer>

<div class="toast" id="toast"></div>

<a class="whatsapp"
 href="https://wa.me/8801955070591"
 target="_blank" aria-label="WhatsApp">☏</a>

<script>

// =================================
// PRODUCT DATABASE
// Homepage-এর Product Name-এর সঙ্গে মিল রাখবে
// =================================

const products={

 "Premium Whey Protein":{
  id:"HTP001",
  name:"Premium Whey Protein",
  category:"Fitness",
  price:3499,
  oldPrice:4499,
  image:[
   "https://placehold.co/500x500/14274b/ffffff?text=Whey+Protein",
   "https://placehold.co/500x500/14274b/ffffff?text=Product+Side"
  ],
  rating:"★★★★★ (125 Reviews)",
  stock:25,
  warranty:"6 Months",
  sold:120,
  description:"Premium Whey Protein with quality and convenience for your fitness routine.",
  features:[
   "Premium quality product",
   "Suitable for everyday fitness routine",
   "Easy to use",
   "Secure packaging",
   "Warranty: 6 Months"
  ]
 },

 "Wireless Earbuds":{
  id:"HTP002",
  name:"Wireless Earbuds",
  category:"Accessories",
  price:1999,
  oldPrice:2499,
  image:[
   "https://placehold.co/500x500/14274b/ffffff?text=Earbuds"
  ],
  rating:"★★★★★ (86 Reviews)",
  stock:18,
  warranty:"3 Months",
  sold:95,
  description:"Wireless Earbuds with a modern and compact design.",
  features:[
   "Wireless connectivity",
   "Compact design",
   "Easy everyday use",
   "3 Months Warranty"
  ]
 },

 "Smart Fitness Watch":{
  id:"HTP003",
  name:"Smart Fitness Watch",
  category:"Fitness",
  price:2499,
  oldPrice:3499,
  image:[
   "https://placehold.co/500x500/14274b/ffffff?text=Smart+Watch"
  ],
  rating:"★★★★★ (100 Reviews)",
  stock:20,
  warranty:"6 Months",
  sold:100,
  description:"A modern smart fitness watch for everyday lifestyle.",
  features:[
   "Modern design",
   "Fitness tracking features",
   "Comfortable everyday use",
   "6 Months Warranty"
  ]
 },

 "Massage Gun":{
  id:"HTP004",
  name:"Massage Gun",
  category:"Wellness",
  price:2499,
  oldPrice:3299,
  image:[
   "https://placehold.co/500x500/14274b/ffffff?text=Massage+Gun"
  ],
  rating:"★★★★★ (67 Reviews)",
  stock:12,
  warranty:"6 Months",
  sold:80,
  description:"A convenient massage device for your wellness routine.",
  features:[
   "Modern design",
   "Convenient operation",
   "Easy handling",
   "6 Months Warranty"
  ]
 }

};

// =================================
// LOAD PRODUCT
// =================================

const params=new URLSearchParams(location.search);
const productName=params.get("name");
const product=products[productName];

if(!product){
 document.querySelector(".container").innerHTML=
 "<h2>Product Not Found!</h2><br><a href='index.html'>Back Home</a>";
 throw new Error("Product not found");
}

document.title=product.name+" | HEALTH TECH PRO";

function money(value){
 return "৳"+value.toLocaleString("en-BD");
}

document.getElementById("category").textContent=product.category;
document.getElementById("name").textContent=product.name;
document.getElementById("price").textContent=money(product.price);
document.getElementById("oldPrice").textContent=money(product.oldPrice);
document.getElementById("discount").textContent=
 Math.round((1-product.price/product.oldPrice)*100)+"% OFF";

document.getElementById("rating").textContent=product.rating;
document.getElementById("stock").textContent=product.stock+" Available";
document.getElementById("warranty").textContent=product.warranty;
document.getElementById("productId").textContent=product.id;
document.getElementById("sold").textContent=product.sold+" Units";
document.getElementById("description").textContent=product.description;

document.getElementById("features").innerHTML=
 product.features.map(x=>`<li>${x}</li>`).join("");

document.getElementById("mainImage").src=product.image[0];

product.image.forEach(src=>{
 const img=document.createElement("img");
 img.src=src;
 img.onclick=()=>document.getElementById("mainImage").src=src;
 document.getElementById("thumbnails").appendChild(img);
});

// =================================
// QUANTITY
// =================================

let quantity=1;

function changeQty(n){
 quantity=Math.max(1,Math.min(product.stock,quantity+n));
 document.getElementById("qty").textContent=quantity;
}

// =================================
// SHARED CART SYSTEM
// Homepage-এর cart key ব্যবহার করা হচ্ছে
// =================================

let cart=JSON.parse(localStorage.getItem("cart")||"[]");

function saveCart(){
 localStorage.setItem("cart",JSON.stringify(cart));
 updateCartCount();
}

function updateCartCount(){
 document.getElementById("cartCount").textContent=
 cart.reduce((sum,item)=>sum+Number(item.qty),0);
}

function addToCart(){

 let item=cart.find(x=>x.name===product.name);

 if(item){
  if(item.qty+quantity>product.stock){
   showToast("Maximum available stock: "+product.stock);
   return false;
  }
  item.qty+=quantity;
 }else{
  cart.push({
   name:product.name,
   price:product.price,
   qty:quantity
  });
 }

 saveCart();
 showToast("Product added to cart!");
 return true;
}

function buyNow(){
 if(addToCart()){
  location.href="checkout.html";
 }
}

function showToast(message){
 const t=document.getElementById("toast");
 t.textContent=message;
 t.style.display="block";
 setTimeout(()=>t.style.display="none",2200);
}

updateCartCount();

</script>
</body>
      </html>
