
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Health Tech Pro</title>
<style>
:root{
  --bg:#050b20;
  --panel:#101a33;
  --blue:#078bff;
  --cyan:#16d9ff;
  --gold:#ffca28;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:var(--bg);
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}
body:before,body:after{
  content:"";
  position:fixed;
  width:300px;height:300px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.2;z-index:-1;
  animation:glow 7s infinite alternate;
}
body:before{background:var(--blue);top:-100px;left:-100px}
body:after{background:#6040e8;bottom:-100px;right:-100px}
@keyframes glow{
  to{transform:translate(60px,40px) scale(1.3)}
}
.card{
  width:100%;max-width:420px;
  padding:28px 23px;
  border:1px solid #176dcb;
  border-radius:20px;
  background:linear-gradient(145deg,#172747,#0a1229);
  box-shadow:0 0 25px #078bff55;
  animation:appear .6s ease;
}
@keyframes appear{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
.logo{
  width:58px;height:58px;
  margin:0 auto 14px;
  display:grid;place-items:center;
  border:2px solid var(--cyan);
  border-radius:16px;
  color:var(--cyan);
  font-size:29px;
  box-shadow:0 0 15px #078bff88;
}
h1{text-align:center;font-size:23px}
h1 span{color:var(--gold)}
.subtitle{
  text-align:center;color:#aebedc;
  font-size:12px;margin:9px 0 24px;
}
.tabs{
  display:flex;gap:8px;
  padding:5px;background:#09152e;
  border-radius:11px;margin-bottom:22px;
}
.tabs button{
  flex:1;padding:11px;border:0;
  border-radius:8px;background:transparent;
  color:#aebedc;font-weight:bold;
}
.tabs button.active{
  background:linear-gradient(90deg,#087fff,#0753b9);
  color:white;box-shadow:0 0 12px #078bff55;
}
.field{margin-bottom:15px}
label{
  display:block;font-size:13px;
  font-weight:bold;margin-bottom:8px;
  color:#dceaff;
}
input{
  width:100%;padding:14px;
  border-radius:10px;
  border:1px solid #2863b2;
  background:#0b1833;color:white;
  outline:none;
}
input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 12px #078bff66;
}
input::placeholder{color:#8295b8}
.main-btn{
  width:100%;padding:14px;
  border:0;border-radius:25px;
  background:linear-gradient(90deg,#ffd34d,#ff9f00);
  color:#111;font-weight:bold;
  margin-top:8px;cursor:pointer;
  transition:.25s;
}
.main-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.main-btn:disabled{opacity:.6;cursor:wait}
.forgot{
  display:block;text-align:right;
  color:var(--cyan);font-size:12px;
  margin:0 0 14px;text-decoration:none;
}
.message{
  display:none;margin-top:15px;
  padding:11px;border-radius:9px;
  font-size:12px;line-height:1.6;
  background:#0b2340;border:1px solid #2863b2;
  color:#dceaff;overflow-wrap:anywhere;
}
.message.error{border-color:#e05b70;color:#ffb5c0}
.message.success{border-color:#20bd86;color:#9dffd9}
.footer{
  text-align:center;color:#8295b8;
  font-size:11px;margin-top:22px;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">♡</div>

  <h1>HEALTH TECH <span>PRO</span></h1>
  <p class="subtitle">ADVANCED WELLNESS • BETTER LIFE</p>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="setMode('login')">Login</button>
    <button id="registerTab" onclick="setMode('register')">Create Account</button>
  </div>

  <form id="authForm">
    <div class="field" id="nameField" style="display:none">
      <label for="name">Full Name</label>
      <input id="name" type="text" maxlength="80"
             placeholder="Enter your full name">
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input id="email" type="email" required
             autocomplete="email" placeholder="Enter your email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" required
             minlength="6" autocomplete="current-password"
             placeholder="Enter your password">
    </div>

    <a href="#" class="forgot" id="forgotBtn"
       onclick="resetPassword(event)">Forgot Password?</a>

    <button class="main-btn" id="submitBtn" type="submit">
      LOGIN →
    </button>
  </form>

  <div class="message" id="message"></div>

  <div class="footer">
    Secure Customer Account<br>
    © 2026 Health Tech Pro
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD0SMf_qXQe4_KHv0JJqbPxfsETGfZJkjw",
  authDomain: "health-tech-pro-435aa.firebaseapp.com",
  projectId: "health-tech-pro-435aa",
  storageBucket: "health-tech-pro-435aa.firebasestorage.app",
  messagingSenderId: "545516143300",
  appId: "1:545516143300:web:34543d5e0c791b241ebf91"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

let mode = "login";

function setMode(value){
  mode = value;

  document.getElementById("loginTab").classList.toggle(
    "active", value === "login"
  );
  document.getElementById("registerTab").classList.toggle(
    "active", value === "register"
  );

  document.getElementById("nameField").style.display =
    value === "register" ? "block" : "none";

  document.getElementById("name").required =
    value === "register";

  document.getElementById("forgotBtn").style.display =
    value === "login" ? "block" : "none";

  document.getElementById("submitBtn").textContent =
    value === "login" ? "LOGIN →" : "CREATE ACCOUNT →";

  document.getElementById("password").autocomplete =
    value === "login" ? "current-password" : "new-password";

  showMessage("");
}

function showMessage(text,type=""){
  const box=document.getElementById("message");
  box.textContent=text;
  box.className="message";
  if(type)box.classList.add(type);
  box.style.display=text?"block":"none";
}

function friendlyError(error){
  const errors={
    "auth/invalid-email":"Please enter a valid email address.",
    "auth/user-not-found":"No account found with this email.",
    "auth/wrong-password":"Incorrect password.",
    "auth/invalid-credential":"Email or password is incorrect.",
    "auth/email-already-in-use":"This email is already registered. Please Login.",
    "auth/weak-password":"Password must contain at least 6 characters.",
    "auth/network-request-failed":"Network error. Check your internet connection.",
    "auth/too-many-requests":"Too many attempts. Please try again later.",
    "auth/operation-not-allowed":"Email/Password Authentication is not enabled in Firebase."
  };

  return errors[error.code] || error.message || "Something went wrong.";
}

document.getElementById("authForm").addEventListener("submit",async function(e){
  e.preventDefault();

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const name=document.getElementById("name").value.trim();

  const btn=document.getElementById("submitBtn");
  btn.disabled=true;
  btn.textContent="PLEASE WAIT...";

  try{
    if(mode==="register"){
      if(!name)throw new Error("Please enter your full name.");

      const result=await auth.createUserWithEmailAndPassword(
        email,password
      );

      await result.user.updateProfile({
        displayName:name
      });

      showMessage("Account created successfully! Opening Checkout...","success");

    }else{
      await auth.signInWithEmailAndPassword(email,password);

      showMessage("Login successful! Opening Checkout...","success");
    }

    setTimeout(()=>{
      location.replace("checkout.html");
    },700);

  }catch(error){
    showMessage(friendlyError(error),"error");
    btn.disabled=false;
    btn.textContent=mode==="login"?"LOGIN →":"CREATE ACCOUNT →";
  }
});

async function resetPassword(e){
  e.preventDefault();

  const email=document.getElementById("email").value.trim();

  if(!email){
    showMessage("Enter your email address first.","error");
    document.getElementById("email").focus();
    return;
  }

  try{
    await auth.sendPasswordResetEmail(email);
    showMessage("Password reset email sent. Check your inbox.","success");
  }catch(error){
    showMessage(friendlyError(error),"error");
  }
}

/* Already logged in? Go directly to Checkout. */
auth.onAuthStateChanged(user=>{
  if(user){
    location.replace("checkout.html");
  }
});
</script>
</body>
</html>
