<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Health Tech Pro</title>
<style>
:root{--bg:#050b20;--panel:#101a33;--blue:#078bff;--cyan:#16d9ff;--gold:#ffca28}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:white;font-family:Arial,sans-serif;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:300px;height:300px;border-radius:50%;filter:blur(100px);opacity:.2;z-index:-1;animation:glow 7s infinite alternate}
body:before{background:var(--blue);top:-100px;left:-100px}
body:after{background:#6040e8;bottom:-100px;right:-100px}
@keyframes glow{to{transform:translate(60px,40px) scale(1.3)}}
.card{width:100%;max-width:420px;padding:28px 23px;border:1px solid #176dcb;border-radius:20px;background:linear-gradient(145deg,#172747,#0a1229);box-shadow:0 0 25px #078bff55;animation:appear .6s ease}
@keyframes appear{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{width:58px;height:58px;margin:0 auto 14px;display:grid;place-items:center;border:2px solid var(--cyan);border-radius:16px;color:var(--cyan);font-size:29px;box-shadow:0 0 15px #078bff88}
h1{text-align:center;font-size:23px}
h1 span{color:var(--gold)}
.subtitle{text-align:center;color:#aebedc;font-size:12px;margin:9px 0 24px}
.tabs{display:flex;gap:8px;padding:5px;background:#09152e;border-radius:11px;margin-bottom:22px}
.tabs button{flex:1;padding:11px;border:0;border-radius:8px;background:transparent;color:#aebedc;font-weight:bold;cursor:pointer}
.tabs button.active{background:linear-gradient(90deg,#087fff,#0753b9);color:white;box-shadow:0 0 12px #078bff55}
.field{margin-bottom:15px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:8px;color:#dceaff}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #2863b2;background:#0b1833;color:white;outline:none}
input:focus{border-color:var(--cyan);box-shadow:0 0 12px #078bff66}
input::placeholder{color:#8295b8}
.password-wrap{position:relative}
.password-wrap input{padding-right:54px}
.toggle-password{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:40px;height:38px;border:1px solid #31517e;border-radius:8px;background:#142747;color:var(--cyan);display:grid;place-items:center;cursor:pointer}
.toggle-password svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.options-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.remember{display:flex;align-items:center;gap:7px;color:#c5d5ed;font-size:12px;cursor:pointer}
.remember input{width:15px;height:15px;accent-color:#078bff}
.forgot{color:var(--cyan);font-size:12px;text-decoration:none}
.save-hint{font-size:10px;color:#8295b8;line-height:1.5;margin-top:-5px;margin-bottom:13px}
.main-btn{width:100%;padding:14px;border:0;border-radius:25px;background:linear-gradient(90deg,#ffd34d,#ff9f00);color:#111;font-weight:bold;margin-top:8px;cursor:pointer;transition:.25s}
.main-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.main-btn:disabled{opacity:.6;cursor:wait}
.message{display:none;margin-top:15px;padding:11px;border-radius:9px;font-size:12px;line-height:1.6;background:#0b2340;border:1px solid #2863b2;color:#dceaff;overflow-wrap:anywhere}
.message.error{border-color:#e05b70;color:#ffb5c0}
.message.success{border-color:#20bd86;color:#9dffd9}
.footer{text-align:center;color:#8295b8;font-size:11px;margin-top:22px}
@media(max-width:380px){.card{padding:24px 17px}.options-row{align-items:flex-start}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">♡</div>
  <h1>HEALTH TECH <span>PRO</span></h1>
  <p class="subtitle">ADVANCED WELLNESS • BETTER LIFE</p>

  <div class="tabs">
    <button id="loginTab" class="active" type="button" onclick="setMode('login')">Login</button>
    <button id="registerTab" type="button" onclick="setMode('register')">Create Account</button>
  </div>

  <form id="authForm">
    <div class="field" id="nameField" style="display:none">
      <label for="name">Full Name</label>
      <input id="name" type="text" maxlength="80" autocomplete="name" placeholder="Enter your full name">
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input id="email" type="email" required autocomplete="email" placeholder="Enter your email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Enter your password">
        <button class="toggle-password" id="togglePassword" type="button" onclick="togglePasswordVisibility()" aria-label="Show password" title="Show password">
          <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="options-row">
      <label class="remember" id="rememberWrap"><input id="rememberMe" type="checkbox" checked> Remember me</label>
      <a href="#" class="forgot" id="forgotBtn" onclick="resetPassword(event)">Forgot Password?</a>
    </div>
    <p class="save-hint" id="saveHint">Your browser or Google Password Manager may offer to save your password after login. Passwords are not stored by this website.</p>

    <button class="main-btn" id="submitBtn" type="submit">LOGIN →</button>
  </form>

  <div class="message" id="message"></div>
  <div class="footer">Secure Customer Account<br>© 2026 Health Tech Pro</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD0SMf_qXQe4_KHv0JJqbPxfsETGfZJkjw",
  authDomain: "health-tech-pro-435aa.firebaseapp.com",
  projectId: "health-tech-pro-435aa",
  storageBucket: "health-tech-pro-435aa.firebasestorage.app",
  messagingSenderId: "545516143300",
  appId: "1:545516143300:web:34543d5e0c791b241ebf91"
};

if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
let mode = "login";

function setMode(value){
  mode=value;
  document.getElementById("loginTab").classList.toggle("active",value==="login");
  document.getElementById("registerTab").classList.toggle("active",value==="register");
  document.getElementById("nameField").style.display=value==="register"?"block":"none";
  document.getElementById("name").required=value==="register";
  document.getElementById("forgotBtn").style.display=value==="login"?"inline":"none";
  document.getElementById("rememberWrap").style.display=value==="login"?"flex":"none";
  document.getElementById("saveHint").style.display=value==="login"?"block":"none";
  document.getElementById("submitBtn").textContent=value==="login"?"LOGIN →":"CREATE ACCOUNT →";
  document.getElementById("password").autocomplete=value==="login"?"current-password":"new-password";
  showMessage("");
}

function togglePasswordVisibility(){
  const input=document.getElementById("password");
  const button=document.getElementById("togglePassword");
  const visible=input.type==="password";
  input.type=visible?"text":"password";
  button.setAttribute("aria-label",visible?"Hide password":"Show password");
  button.title=visible?"Hide password":"Show password";
  document.getElementById("eyeIcon").innerHTML=visible
    ? '<path d="M3 3l18 18"/><path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.5 0 2.8-.3 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'
    : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
}

function showMessage(text,type=""){
  const box=document.getElementById("message");
  box.textContent=text;
  box.className="message";
  if(type)box.classList.add(type);
  box.style.display=text?"block":"none";
}

function friendlyError(error){
  const errors={
    "auth/invalid-email":"Please enter a valid email address.",
    "auth/user-not-found":"No account found with this email.",
    "auth/wrong-password":"Incorrect password.",
    "auth/invalid-credential":"Email or password is incorrect.",
    "auth/email-already-in-use":"This email is already registered. Please Login.",
    "auth/weak-password":"Password must contain at least 6 characters.",
    "auth/network-request-failed":"Network error. Check your internet connection.",
    "auth/too-many-requests":"Too many attempts. Please try again later.",
    "auth/operation-not-allowed":"Email/Password Authentication is not enabled in Firebase."
  };
  return errors[error.code]||error.message||"Something went wrong.";
}

document.getElementById("authForm").addEventListener("submit",async function(e){
  e.preventDefault();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const name=document.getElementById("name").value.trim();
  const btn=document.getElementById("submitBtn");
  btn.disabled=true;
  btn.textContent="PLEASE WAIT...";

  try{
    if(mode==="login"){
      const persistence=document.getElementById("rememberMe").checked
        ? firebase.auth.Auth.Persistence.LOCAL
        : firebase.auth.Auth.Persistence.SESSION;
      await auth.setPersistence(persistence);
      await auth.signInWithEmailAndPassword(email,password);
      showMessage("Login successful! Opening Checkout...","success");
    }else{
      if(!name)throw new Error("Please enter your full name.");
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      const result=await auth.createUserWithEmailAndPassword(email,password);
      await result.user.updateProfile({displayName:name});
      showMessage("Account created successfully! Opening Checkout...","success");
    }
    setTimeout(()=>location.replace("checkout.html"),700);
  }catch(error){
    showMessage(friendlyError(error),"error");
    btn.disabled=false;
    btn.textContent=mode==="login"?"LOGIN →":"CREATE ACCOUNT →";
  }
});

async function resetPassword(e){
  e.preventDefault();
  const email=document.getElementById("email").value.trim();
  if(!email){
    showMessage("Enter your email address first.","error");
    document.getElementById("email").focus();
    return;
  }
  try{
    await auth.sendPasswordResetEmail(email);
    showMessage("Password reset email sent. Check your inbox.","success");
  }catch(error){
    showMessage(friendlyError(error),"error");
  }
}

/* Already logged in? Go directly to Checkout. */
auth.onAuthStateChanged(user=>{
  if(user) location.replace("checkout.html");
});
</script>
</body>
</html>
